<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Administration</title>
    <style>
      /* Same palette/font as Pixels' own .pa-* skin (see client/src/ui/paSkin.ts
         and pixelRexTheme.ts) — one visual identity across the game and the
         admin site instead of two independently-maintained looks. */
      @font-face {
        font-family: 'FS Pixel Sans';
        src: url('/fonts/FSPixelSansUnicode-Regular.ttf') format('truetype');
        font-weight: 400;
        font-display: block;
      }
      :root {
        --bg: #0a0d16;
        --panel: #0f1220;
        --panel2: #171b2b;
        --line: #05060b;
        --text: #e9ecf7;
        --muted: #8a90a8;
        --accent: #2f66b0;
        --accent2: #2f7d3f;
        --danger: #7c2634;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'FS Pixel Sans', ui-monospace, monospace;
      }
      #app { display: flex; flex-direction: column; min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
