<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Administration</title>
    <style>
      /* Same palette/font as Pixels' own .pa-* skin (see client/src/ui/paSkin.ts
         and pixelRexTheme.ts) — one visual identity across the game and the
         admin site instead of two independently-maintained looks. */
      @font-face {
        font-family: 'FS Pixel Sans';
        src: url('/fonts/FSPixelSansUnicode-Regular.ttf') format('truetype');
        font-weight: 400;
        font-display: block;
      }
      /* Same responsive rem scale as client/index.html — 1rem grows with the
         viewport, so admin.html's rem-based sizing matches Pixels' instead of
         sitting at the browser's plain 16px default. */
      :root {
        font-size: clamp(17px, 0.5vw + 13px, 26px);
        --bg: #141312;
        --panel: #1c1a19;
        --panel2: #262422;
        --line: #0a0908;
        --text: #f1efec;
        --muted: #818586;
        --accent: #c51a1b;
        --accent2: #3e7a30;
        --danger: #7c2634;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'FS Pixel Sans', ui-monospace, monospace;
      }
      #app { display: flex; flex-direction: column; min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
