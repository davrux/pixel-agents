<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>pixel-agents · Map Editor</title>
    <style>
      @font-face {
        font-family: 'FS Pixel Sans';
        src: url('/fonts/FSPixelSansUnicode-Regular.ttf') format('truetype');
        font-weight: 400;
        font-display: block;
      }
      html, body { margin: 0; padding: 0; height: 100%; background: #171514; overflow: hidden; }
      :root { font-size: clamp(17px, 0.5vw + 13px, 26px); }
      #game { width: calc(100vw - var(--pa-side-panel-w, 0px)); height: 100vh; transition: width 0.18s ease; }
      #status {
        position: fixed; top: 0.5rem; left: 0.5rem; z-index: 10;
        font: 0.85rem/1.4 'FS Pixel Sans', ui-monospace, monospace; color: #adb0b2;
        background: rgba(0,0,0,.4); padding: 0.25rem 0.5rem; border-radius: 0.25rem;
        pointer-events: none;
      }
    </style>
    <script>
      // Land here without the query param (typed the bare URL, bookmark,
      // etc.) → add it once. OfficeScene.maybeAutoEnterEditMode() reads this
      // to open straight into the layout editor instead of the normal
      // walk-around game — this page IS the editor, there's no reason to
      // land anywhere else first.
      if (new URLSearchParams(location.search).get('edit') !== '1') {
        const url = new URL(location.href);
        url.searchParams.set('edit', '1');
        location.replace(url);
      }
    </script>
  </head>
  <body>
    <div id="game"></div>
    <div id="status">connecting…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
