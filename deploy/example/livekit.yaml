# LiveKit for the single-host example.
#
# The API key and secret are NOT in this file: they come from the LIVEKIT_KEYS
# environment variable (see docker-compose.yml and .env.example), so this file
# can stay in git. They must be the SAME pair pixel-agents is given, or every
# call fails with an invalid token and nothing says why.
port: 7880
bind_addresses:
    - ""
rtc:
    tcp_port: 7881
    # Media. This range is why LiveKit runs with host networking: mapping 10 001
    # UDP ports one by one is not something Docker will do for you.
    port_range_start: 50000
    port_range_end: 60000
    # Discover this host's public address via STUN at startup. Correct for a
    # host whose address can change.
    #
    # If your host has a STATIC public IP, pin it instead — a discovered address
    # is re-discovered only on restart, so a machine that changes address while
    # running keeps handing out ICE candidates that point nowhere:
    #
    #     use_external_ip: false
    #     node_ip: 203.0.113.10
    #
    # Both lines, together. LiveKit's own comment is explicit that
    # use_external_ip takes precedence, so setting node_ip while leaving
    # use_external_ip true changes nothing at all — and looks done.
    use_external_ip: true
    enable_loopback_candidate: false
redis:
    address: localhost:6379
    username: ""
    password: ""
    db: 0
    use_tls: false
turn:
    enabled: true
    # Must match the certificate Caddy obtains, and the SNI route in caddy.yaml.
    domain: livekit-turn.example.com
    tls_port: 5349
    udp_port: 3478
    # Caddy terminates TLS on 443 and forwards by SNI, so LiveKit expects
    # PLAINTEXT on 5349. Leave this true unless you remove Caddy from the path.
    external_tls: true
