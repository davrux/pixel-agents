# electron-builder packaging config for the Pixel Agents desktop app.
# Produces packages for all three desktops with no code-signing certs: Linux
# AppImage, Windows NSIS installer, macOS dmg for x64 + arm64 (ad-hoc signed —
# see `mac.identity` for why that is not the same as unsigned). T5.3
# confirms install-and-launch on real Linux; Windows and macOS have only ever
# been built, never installed and launched by a human. The authoritative build
# gate is T5.1.
#
# Build each target on its own OS. .github/workflows/desktop.yml runs the three
# in parallel on their own runners; `pnpm dist:desktop` on your own machine only
# ever produces a package for the machine you are sitting at, because
# electron-builder with no platform flag targets the host.
#
# What cross-building from Linux actually does, measured rather than assumed:
#   --win --dir   works, no wine — it packages win-unpacked and even generates
#                 the .ico from icon.png
#   --win         FAILS with "spawn wine ENOENT": the NSIS installer step needs
#                 wine. It leaves a ~180 KB .exe behind, which is the installer
#                 stub without its payload — a broken file that looks plausible.
#                 Delete it if you ever see one.
#   --mac         not possible here at all; the dmg needs macOS's hdiutil.
#
# Nothing here needs a per-platform native rebuild: the main process imports
# only `electron`, `node:` builtins (Mumble included — it speaks its protocol
# over node:tls) and the pure-JS electron-updater bundle that `build:vendor`
# emits into dist/vendor, and desktop/package.json declares no runtime
# dependencies at all.
#
# Packaged layout must satisfy the path math in desktop/src/main.ts, which
# resolves from import.meta.url: main.js + preload.js sit together, and
# client/dist is two directories above them. Compiling desktop/src -> desktop/dist
# means main.js lives at <app>/desktop/dist/main.js, so ../../client/dist ->
# <app>/client/dist. The files mapping below reproduces that structure in the asar.
appId: org.pixelagents.desktop
productName: Pixel Agents
# Filesystem-safe binary name. Without this, electron-builder derives the Linux
# executableName from the scoped package name "@pixel/desktop" -> "@pixeldesktop",
# whose "@" cannot be used safely in file paths and aborts the AppImage build.
executableName: pixel-agents

directories:
  # icon.png (+ any future variants) resolved here; also the AppImage icon source.
  buildResources: build
  output: release

# Self-update feed (electron-updater, driven by desktop/src/updater.ts): the
# rolling "latest" GitHub release. This block does two things at build time —
# it bakes a resources/app-update.yml with this URL into the Linux/Windows
# packages, and it writes the latest.yml / latest-linux.yml channel files into
# release/, which the CI release job uploads next to the versioned artifacts
# (the channel files reference them by exact name). CI still builds with
# `--publish never`; that flag only stops electron-builder from UPLOADING.
#
# The GENERIC provider and not `github`, deliberately: the github provider
# resolves releases by semver TAG, and the rolling release's tag is the
# non-semver literal `latest`. A fixed download URL sidesteps that and the
# GitHub API rate limit with it.
publish:
  provider: generic
  url: https://github.com/davrux/pixel-agents/releases/download/latest

# The compiled Electron main/preload (desktop/dist, emitted by the T4.6
# build:desktop step) plus the client Vite output that the app:// protocol serves.
# from/to preserves desktop/src/main.ts's expected relative layout inside the asar.
files:
  - from: dist
    to: desktop/dist
    filter:
      - '**/*'
      # `pnpm test` compiles the suite (tests included) to dist/test-build so it
      # can run as plain JS; that output must never reach the packaged app.
      - '!test-build/**'
  # Tray icons, read at runtime by desktop/src/tray.ts as ../assets relative to
  # the compiled main — so this mapping has to mirror the dist -> desktop/dist
  # one above, or the tray silently finds no icon in a packaged build.
  - from: assets
    to: desktop/assets
    filter:
      - '**/*'
  - from: ../client/dist
    to: client/dist
    filter:
      - '**/*'
      # Game bundles are fetched from the connected server at runtime (see
      # ArcadeUI.resolveArcadeUrl); don't ship ~80 MB in the asar.
      - '!jsdos/bundles/**'
  - package.json

# Electron main entry inside the packaged app (the compiled desktop/dist/main.js).
extraMetadata:
  main: desktop/dist/main.js

linux:
  target:
    - AppImage
  # Created placeholder pixel-art icon (no icon asset exists in the repo;
  # explicit design deviation). Replace with a final icon later.
  icon: build/icon.png
  category: Network
  # electron-builder 26.x relocated the .desktop filename to package.json's
  # "desktopName"; this flag syncs the installed .desktop entry to it so it
  # matches Electron's app_id / StartupWMClass (clears the WM_CLASS advisory).
  syncDesktopName: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png

nsis:
  # Not electron-builder's default one-click installer, which installs the
  # moment you open it with no directory prompt — that reads like something
  # that got past you, doubly so for an unsigned binary SmartScreen has just
  # warned about. perMachine stays at its default (false), so the installer
  # never asks for an admin prompt it cannot justify with a signature.
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      # Apple Silicon needs its own slice. Without arm64 here those users get
      # the x64 build running under Rosetta, which for an Electron app means
      # paying the translation cost on every frame.
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.social-networking
  # Ad-hoc signed ("-"), NOT unsigned.
  #
  # This was `identity: null` (skip signing entirely), which is fine on Intel —
  # you get the usual "unidentified developer" prompt and can right-click →
  # Open. On Apple Silicon it is fatal: arm64 code must carry a valid signature
  # to execute at all, so the app cannot launch and Finder reports the
  # misleading "'Pixel Agents' is damaged and can't be opened. You should move
  # it to the Bin." Nothing is damaged; there is simply no signature.
  #
  # "-" signs with no identity, which satisfies the arm64 requirement without a
  # certificate. It is still not notarised, so a download is still quarantined
  # and Gatekeeper still asks — but it is now the answerable kind of question
  # (Open Anyway / xattr -dr com.apple.quarantine, see the release notes) rather
  # than a dead end.
  identity: "-"
  # No update feed on macOS: Squirrel.Mac verifies the code signature before it
  # applies an update, and an ad-hoc signed build fails that check — so a mac
  # package must not carry a feed it can never use (desktop/src/updater.ts
  # reports the platform as unsupported for the same reason). This also spares
  # the zip target electron-builder demands as soon as a mac build publishes.
  publish: null
  # Required with ad-hoc signing: hardened runtime enforces library validation,
  # which rejects Electron's pre-signed framework because it carries a different
  # Team ID, and the app dies on launch. The alternative is an entitlements file
  # granting com.apple.security.cs.disable-library-validation — more moving
  # parts for something whose only purpose is to satisfy notarisation, which an
  # unsigned build is not doing anyway.
  hardenedRuntime: false
  notarize: false

# No signing on any platform (no certs available in this environment / CI), so
# each OS greets the download in its own way: macOS Gatekeeper refuses an
# unsigned app outright until it is un-quarantined, Windows shows a SmartScreen
# warning, Linux just needs chmod +x. Release notes say so.
#
# The literal `pixel-agents` prefix is deliberate (not ${productName}, which
# contains a space, and ${executableName} is not a supported artifactName
# macro) and keeps the filename shell-friendly. ${ext} is what makes one
# artifactName safe for all three platforms: this used to hardcode .AppImage,
# which would have named the Windows installer "…-x64.AppImage" — a file
# Windows will not run on a double-click.
artifactName: pixel-agents-${version}-${arch}.${ext}
