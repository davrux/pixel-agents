name: Desktop packages

# Baut das Electron-Desktop-Paket für alle drei Desktops (unsigniert — siehe
# desktop/electron-builder.yml) und veröffentlicht sie als Release-Assets:
#
#   ubuntu-latest   -> Linux AppImage (x86_64)
#   windows-latest  -> NSIS-Installer (x64)
#   macos-latest    -> dmg (x64 + arm64)
#
# Jedes Ziel muss auf seinem eigenen Betriebssystem gebaut werden; das macOS-dmg
# braucht hdiutil, cross-compilieren geht nicht. Darum eine Matrix statt eines
# Jobs mit drei --flags.
#
#   push master        -> alle Pakete bauen + an das rollende Prerelease "latest"
#                         hängen (Release + Tag werden auf den neuen Commit
#                         umgesetzt, alte Assets fallen dabei weg)
#   push tag v*        -> alle Pakete bauen + an das Release "v<x.y.z>" hängen
#                         (Release wird angelegt, falls es noch nicht existiert)
#   workflow_dispatch  -> nur bauen und als Workflow-Artifact ablegen
#
# Bauen und Veröffentlichen sind bewusst zwei Jobs: der "latest"-Schritt löscht
# das Release und legt es neu an, und drei Matrix-Jobs, die das gleichzeitig
# tun, würden sich gegenseitig die Assets wegräumen. Der release-Job läuft
# genau einmal, nachdem alle drei Builds durch sind.
#
# Keine zusätzlichen Secrets nötig: der eingebaute GITHUB_TOKEN darf Releases
# schreiben (permissions.contents: write, nur im release-Job).

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch: {}

# Pro Ref nur ein Build. Auf master zählt ohnehin nur der jüngste Commit, also
# darf ein laufender Build abgebrochen werden — das verhindert gleichzeitig, dass
# sich zwei Läufe beim Umsetzen des "latest"-Release in die Quere kommen.
concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # Ein kaputter macOS-Build soll nicht das fertige Windows-Paket mitreißen:
      # lieber zwei brauchbare Assets und ein rotes Kreuz als gar keins.
      fail-fast: false
      matrix:
        # Linux/Windows sammeln neben dem Paket auch die latest*.yml-Kanaldateien
        # ein, die electron-builder dank der publish-Konfiguration schreibt — sie
        # sind der Update-Feed, aus dem sich installierte Apps selbst
        # aktualisieren (electron-updater, desktop/src/updater.ts). Windows dazu
        # die .blockmap, mit der der Updater differenziell lädt. macOS hat
        # bewusst keinen Feed (publish: null in electron-builder.yml — ad-hoc
        # signiert kann sich dort nichts selbst aktualisieren).
        include:
          - os: ubuntu-latest
            label: linux
            glob: |
              desktop/release/*.AppImage
              desktop/release/latest-linux.yml
          - os: windows-latest
            label: windows
            glob: |
              desktop/release/*.exe
              desktop/release/*.exe.blockmap
              desktop/release/latest.yml
          - os: macos-latest
            label: macos
            glob: desktop/release/*.dmg
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.label }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable corepack (pnpm aus packageManager)
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile funktioniert auf allen drei Runnern, weil pnpm-lock.yaml
      # die plattformspezifischen Binaries (@esbuild/*, @rolldown/binding-*) für
      # darwin und win32 mitführt.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Die Paketversion (und damit der Dateiname, siehe artifactName in
      # desktop/electron-builder.yml) kommt aus desktop/package.json. Bei einem
      # Tag-Build wird sie auf den Tag gesetzt, damit Asset und Release-Tag
      # zusammenpassen. Alle drei Jobs berechnen dasselbe.
      #
      # Ein master-Build muss für electron-updater MONOTON und semver-vergleichbar
      # sein — der Updater installiert nur, was semver-größer ist als das
      # Installierte. Deshalb: Patch+1 gegenüber desktop/package.json (so ist
      # jeder master-Build neuer als das zuletzt getaggte Release, solange
      # package.json dessen Version trägt), dann die Run-Nummer als zählendes
      # Prerelease-Feld. Der Commit bleibt als g<sha> für die Rückverfolgung —
      # das g-Präfix (git-Stil) verhindert einen rein numerischen Identifier mit
      # führender Null, den semver zurückweisen würde. Der alte Suffix
      # `-master.<sha>` ordnete nicht (shas zählen nicht) und konnte daher nie
      # als Update erkannt werden.
      - name: Version stempeln
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          if [ "$REF_TYPE" = tag ]; then
            export VERSION="${TAG#v}"
          else
            NEXT_PATCH="$(node -p 'const v = require("./desktop/package.json").version.split("."); `${v[0]}.${v[1]}.${Number(v[2]) + 1}`')"
            export VERSION="${NEXT_PATCH}-master.${RUN_NUMBER}.g${SHA:0:7}"
          fi
          node -e '
            const fs = require("node:fs");
            const p = "desktop/package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
          '
          echo "desktop version -> $VERSION"
        shell: bash

      # pnpm dist:desktop = client bauen -> desktop/dist bauen -> electron-builder.
      # Hier absichtlich einzeln, um --publish never mitgeben zu können:
      # electron-builder soll nichts von sich aus hochladen, die Assets hängt der
      # release-Job unten an. Ohne --arch/--win/--mac baut electron-builder für
      # den Runner, auf dem er läuft — genau das, was die Matrix will.
      #
      # vendor:mediapipe zuerst: die Konferenz-Hintergrundfilter (Blur / virtueller
      # Hintergrund) laden ihren Segmenter aus client/dist/mediapipe — im Desktop-App
      # wird das Bundle lokal über app:// serviert, ein CDN gibt es nicht.
      - name: Build
        run: pnpm run vendor:mediapipe && pnpm run build:desktop && pnpm --filter @pixel/desktop exec electron-builder --publish never
        shell: bash

      - name: Upload als Workflow-Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pixel-agents-${{ matrix.label }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    needs: build
    # Nur für master und v*-Tags. Ein workflow_dispatch endet bei den
    # Workflow-Artifacts aus dem build-Job.
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    # Kein `if: always()`: schlägt ein Plattform-Build fehl, wird nichts
    # veröffentlicht. Ein "latest"-Release, dem stillschweigend eine Plattform
    # fehlt, ist schlimmer als eines, das diesmal ausbleibt — die fertigen
    # Pakete liegen dank fail-fast: false trotzdem als Workflow-Artifacts bereit.
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release anlegen / Asset hochladen
    # Dieser Job checkt das Repo absichtlich nicht aus — er lädt nur die
    # Artifacts der Build-Jobs herunter. `gh release` ermittelt das Repository
    # aber sonst aus dem git-Remote und scheitert dann mit "failed to run git:
    # fatal: not a git repository". GH_REPO ist die dafür vorgesehene Variable
    # und billiger als ein Checkout, den wir nur für ein Remote machen würden.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # merge-multiple: alle drei Artifacts flach in ein Verzeichnis, sodass die
      # Schritte unten einfach über die Dateien laufen können.
      - name: Pakete einsammeln
        uses: actions/download-artifact@v7
        with:
          pattern: pixel-agents-*
          path: packages
          merge-multiple: true

      - name: Was wurde gebaut
        run: ls -la packages
        shell: bash

      # Rollendes "latest"-Release: immer der Build des letzten master-Commits.
      # Jedes Paket hängt hier ZWEIMAL: einmal unter seinem versionierten
      # Original-Namen — auf den verweisen die latest*.yml-Kanaldateien, aus
      # denen sich installierte Apps selbst aktualisieren (electron-updater lädt
      # exakt den Dateinamen aus dem Feed) — und einmal als versionsloser Alias,
      # damit die dokumentierten Download-URLs
      # (…/releases/download/latest/pixel-agents-latest-x86_64.AppImage) stabil
      # bleiben. Release + Tag werden gelöscht und neu angelegt, weil
      # GitHub einen bereits veröffentlichten Tag nicht umhängen lässt.
      # Prerelease, damit GitHub weiterhin das jüngste v*-Release als "Latest
      # release" anzeigt.
      - name: An das "latest"-Release hängen
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          mkdir -p upload
          built=""
          for src in packages/*; do
            base="$(basename "$src")"
            case "$base" in
              *.yml|*.blockmap)
                # Update-Feed: Kanaldateien und Blockmaps unverändert, unter
                # ihren Originalnamen — genau so fragt electron-updater sie an.
                cp "$src" "upload/$base"
                ;;
              *)
                # Das versionierte Original (der Feed lädt diesen Namen) …
                cp "$src" "upload/$base"
                # … plus Alias ohne Version, Architektur und Endung behalten:
                # pixel-agents-0.1.1-master.7.gabc1234-arm64.dmg -> pixel-agents-latest-arm64.dmg
                ext="${base##*.}"
                stem="${base%.*}"
                arch="${stem##*-}"
                cp "$src" "upload/pixel-agents-latest-$arch.$ext"
                built="$built
          - \`$base\`"
                ;;
            esac
          done

          gh release delete latest --yes --cleanup-tag || true
          # Falls der Tag ohne Release überlebt hat: weg damit, sonst ignoriert
          # `gh release create` das --target und das Release hängt am alten Commit.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" >/dev/null 2>&1 || true

          gh release create latest \
            --target "$SHA" \
            --prerelease \
            --title "Latest master build" \
            --notes "Automatischer Build von master, Commit \`${SHA:0:7}\`.
          $built

          Alle Pakete sind **unsigniert**, jedes Betriebssystem meldet sich dazu anders:

          - **Linux** (\`.AppImage\`): nach dem Download ausführbar machen (\`chmod +x\`).
          - **Windows** (\`.exe\`): SmartScreen warnt vor einem unbekannten Herausgeber — \"Weitere Informationen\" → \"Trotzdem ausführen\".
          - **macOS** (\`.dmg\`): ad-hoc signiert, aber nicht notarisiert — Gatekeeper fragt beim ersten Start nach. Im Finder rechtsklicken → \"Öffnen\" (nicht Doppelklick), oder nach dem Kopieren in \"Programme\" einmal \`xattr -dr com.apple.quarantine \"/Applications/Pixel Agents.app\"\`. \`arm64\` ist für Apple Silicon (M1-M4), \`x64\` für Intel — die falsche Variante startet nicht.

          Einmal installiert, aktualisiert sich die App aus diesem Release selbst (Linux-AppImage und Windows; macOS kann das ohne echte Signatur nicht) — über den Update-Dialog oder das Tray-Menü \"Check for updates…\".

          Dieses Release wird bei jedem master-Commit überschrieben; für einen festen Stand ein \`v*\`-Release nehmen."
          gh release upload latest upload/* --clobber
        shell: bash

      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" packages/* --clobber
        shell: bash
