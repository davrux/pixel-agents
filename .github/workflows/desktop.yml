name: Desktop AppImage

# Baut das Electron-Desktop-Paket (Linux AppImage, unsigniert — siehe
# desktop/electron-builder.yml) und veröffentlicht es als Release-Asset.
#
#   push master        -> AppImage bauen + an das rollende Prerelease "latest"
#                         hängen (Release + Tag werden auf den neuen Commit
#                         umgesetzt, alte Assets fallen dabei weg)
#   push tag v*        -> AppImage bauen + an das Release "v<x.y.z>" hängen
#                         (Release wird angelegt, falls es noch nicht existiert)
#   workflow_dispatch  -> AppImage bauen und nur als Workflow-Artifact ablegen
#
# Keine zusätzlichen Secrets nötig: der eingebaute GITHUB_TOKEN darf Releases
# schreiben (permissions.contents: write).

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch: {}

# Pro Ref nur ein Build. Auf master zählt ohnehin nur der jüngste Commit, also
# darf ein laufender Build abgebrochen werden — das verhindert gleichzeitig, dass
# sich zwei Läufe beim Umsetzen des "latest"-Release in die Quere kommen.
concurrency:
  group: desktop-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release anlegen / Asset hochladen
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable corepack (pnpm aus packageManager)
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Die AppImage-Version (und damit der Dateiname, siehe artifactName in
      # desktop/electron-builder.yml) kommt aus desktop/package.json. Bei einem
      # Tag-Build wird sie auf den Tag gesetzt, damit Asset und Release-Tag
      # zusammenpassen; bei einem master-Build wird der Commit als
      # Prerelease-Suffix angehängt, damit man einem installierten AppImage
      # ansieht, aus welchem Stand es gebaut wurde.
      - name: Version stempeln
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          if [ "$REF_TYPE" = tag ]; then
            export VERSION="${TAG#v}"
          else
            export VERSION="$(node -p 'require("./desktop/package.json").version')-master.${SHA:0:7}"
          fi
          node -e '
            const fs = require("node:fs");
            const p = "desktop/package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
          '
          echo "desktop version -> $VERSION"
        shell: bash

      # pnpm dist:desktop = client bauen -> desktop/dist bauen -> electron-builder.
      # --publish never: electron-builder soll nichts von sich aus hochladen, die
      # Assets hängen die Schritte unten an.
      - name: Build AppImage
        # vendor:mediapipe zuerst: die Konferenz-Hintergrundfilter (Blur / virtueller
        # Hintergrund) laden ihren Segmenter aus client/dist/mediapipe — im Desktop-App
        # wird das Bundle lokal über app:// serviert, ein CDN gibt es nicht.
        run: pnpm run vendor:mediapipe && pnpm run build:desktop && pnpm --filter @pixel/desktop exec electron-builder --publish never

      - name: Upload als Workflow-Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pixel-agents-appimage
          path: desktop/release/*.AppImage
          if-no-files-found: error

      # Rollendes "latest"-Release: immer der Build des letzten master-Commits.
      # Der Dateiname ist bewusst *ohne* Version, damit die Download-URL
      # (…/releases/download/latest/pixel-agents-latest-x86_64.AppImage) stabil
      # bleibt; die tatsächlich gebaute Version steckt im AppImage und in den
      # Release-Notes. Release + Tag werden gelöscht und neu angelegt, weil
      # GitHub einen bereits veröffentlichten Tag nicht umhängen lässt.
      # Prerelease, damit GitHub weiterhin das jüngste v*-Release als "Latest
      # release" anzeigt.
      - name: An das "latest"-Release hängen
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          src="$(ls desktop/release/*.AppImage | head -1)"
          arch="$(basename "$src" .AppImage)"
          arch="${arch##*-}"
          asset="desktop/release/pixel-agents-latest-$arch.AppImage"
          cp "$src" "$asset"

          gh release delete latest --yes --cleanup-tag || true
          # Falls der Tag ohne Release überlebt hat: weg damit, sonst ignoriert
          # `gh release create` das --target und das Release hängt am alten Commit.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" >/dev/null 2>&1 || true

          gh release create latest \
            --target "$SHA" \
            --prerelease \
            --title "Latest master build" \
            --notes "Automatischer Build von master ($(basename "$src")), Commit \`${SHA:0:7}\`.

          Unsigniertes Linux-AppImage — nach dem Download ausführbar machen (\`chmod +x\`).
          Dieses Release wird bei jedem master-Commit überschrieben; für einen festen Stand ein \`v*\`-Release nehmen."
          gh release upload latest "$asset" --clobber
        shell: bash

      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" desktop/release/*.AppImage --clobber
        shell: bash
