name: Build, Push & Deploy

# Zweistufig:
#   1) build-push: Docker-Image bauen (auf dem GitHub-Runner, unabhängig von der
#      Runtime auf dem Zielserver) und PUBLIC nach ghcr.io pushen (eingebauter
#      GITHUB_TOKEN, kein PAT nötig).
#   2) deploy:     per SSH auf den Zielserver, Compose-Datei kopieren, .env aus
#      GitHub Secrets schreiben, Image aus ghcr pullen und mit docker compose starten.
#
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   SERVER_HOST          Hostname/IP des Zielservers (auch coturn --realm/--external-ip)
#   SERVER_USER           SSH-Benutzer (Deploy landet in ~/pixel-agents)
#   SSH_PRIVATE_KEY       privater SSH-Schlüssel für diesen Benutzer
#   PIXEL_ADMIN_TOKEN     Admin-Login-Token der App
#   LIVEKIT_API_KEY       LiveKit API Key
#   LIVEKIT_API_SECRET    LiveKit API Secret
#   ARCADE_TURN_SECRET    TURN shared secret (identisch für pixel-agents + coturn)
# (Der SERVER_USER muss Docker ohne sudo ausführen dürfen, z. B. Mitglied der
#  Gruppe 'docker' sein, und 'docker compose' v2 verfügbar haben. Das
#  Verzeichnis ~/pixel-agents mit dem bereits befüllten arcade-content/ muss
#  auf dem Server existieren. Port 80+443 (tcp, für QUIC/HTTP3 auch udp) müssen
#  frei/offen sein — Caddy terminiert dort TLS für pixels.meik.info (DNS A +
#  AAAA müssen auf den Server zeigen, siehe deploy/Caddyfile).)
#
# Package-Sichtbarkeit: Ein frisch gepushtes ghcr-Package ist per Default
# PRIVATE, unabhängig von der Repo-Sichtbarkeit. Einmalig nach dem ersten
# Push auf https://github.com/users/davrux/packages/container/pixel-agents/settings
# auf "Public" stellen.

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # -> ghcr.io/davrux/pixel-agents

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # nötig, damit GITHUB_TOKEN ins ghcr pushen darf
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compose-Datei + Caddyfile auf den Server kopieren
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: |
            deploy/docker-compose.prod.yml
            deploy/Caddyfile
          target: "pixel-agents"
          strip_components: 1 # legt die Dateien als ~/pixel-agents/{docker-compose.prod.yml,Caddyfile} ab

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          PIXEL_ADMIN_TOKEN: ${{ secrets.PIXEL_ADMIN_TOKEN }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          ARCADE_TURN_SECRET: ${{ secrets.ARCADE_TURN_SECRET }}
          TURN_EXTERNAL_IP: ${{ secrets.SERVER_HOST }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_IMAGE,PIXEL_ADMIN_TOKEN,LIVEKIT_API_KEY,LIVEKIT_API_SECRET,ARCADE_TURN_SECRET,TURN_EXTERNAL_IP
          script: |
            set -e
            cd ~/pixel-agents
            umask 077
            cat > .env <<EOF
            GHCR_IMAGE=$GHCR_IMAGE
            PIXEL_ADMIN_TOKEN=$PIXEL_ADMIN_TOKEN
            LIVEKIT_API_KEY=$LIVEKIT_API_KEY
            LIVEKIT_API_SECRET=$LIVEKIT_API_SECRET
            ARCADE_TURN_SECRET=$ARCADE_TURN_SECRET
            TURN_EXTERNAL_IP=$TURN_EXTERNAL_IP
            EOF
            chmod 600 .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
